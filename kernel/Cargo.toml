[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.32"
libc = "0.2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlite-vec = "0.1.9"
serde_json = "1.0.150"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
ssh2 = "0.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1.2"
